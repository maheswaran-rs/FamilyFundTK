
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Fund Scheme</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --primary-color: #0984e3;
            --secondary-color: #636e72;
            --border-color: #dfe6e9;
            --accent-color: #00b894;
            --header-bg: #2d3436;
            --header-text: #dfe6e9;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f5f5f5;
            --primary-color: #74b9ff;
            --border-color: #444;
            --shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            transition: all 0.3s ease;
        }

        .container { max-width: 100%; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--header-bg);
            color: var(--header-text);
            padding: 1rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        .control-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.75rem; text-transform: uppercase; }

        select, input {
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: var(--secondary-color); color: white; }
        .btn-success { background-color: var(--accent-color); color: white; }

        .multi-select {
            height: 100px;
            overflow-y: auto;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 5px;
            background: var(--card-bg);
        }
        .multi-select label {
            display: flex;
            align-items: center;
            font-weight: normal;
            text-transform: none;
            padding: 3px;
            font-size: 0.85rem;
        }

        /* MOBILE FIX: TABLE CONTAINER */
        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: auto; /* Required for sticky */
            max-height: 75vh;
            position: relative;
            -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            table-layout: auto;
        }

        th, td {
            padding: 10px 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            font-size: 0.85rem;
        }

        /* THEAD STICKY */
        thead th {
            position: sticky;
            top: 0;
            background: var(--header-bg);
            color: white !important;
            z-index: 20;
        }

        /* STICKY COLUMN 1: Member Name */
        th:first-child, td:first-child {
            position: sticky;
            left: 0;
            z-index: 15;
            text-align: left;
            background: var(--card-bg);
            border-right: 2px solid var(--border-color);
            min-width: 120px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* STICKY COLUMN 2: Total Amount */
        /* Using a fixed left offset for column 1 width */
        th:nth-child(2), td:nth-child(2) {
            position: sticky;
            left: 120px; /* Must match min-width of Col 1 */
            z-index: 15;
            background: #eef2f7; 
            color: #1a1a1a;
            font-weight: 700;
            border-right: 2px solid var(--border-color);
            min-width: 100px;
        }
        
        [data-theme="dark"] td:nth-child(2) { background: #2c3e50; color: #fff; }
        [data-theme="dark"] td:first-child { background: #1e1e1e; }

        /* Ensure Header parts of sticky columns have higher z-index and correct colors */
        thead th:first-child { z-index: 25; background: var(--header-bg); }
        thead th:nth-child(2) { z-index: 25; background: var(--header-bg); left: 120px; }

        /* FOOTER STICKY */
        tfoot {
            position: sticky;
            bottom: 0;
            z-index: 20;
        }
        tfoot td {
            background: var(--header-bg);
            color: white;
            font-weight: bold;
        }
        tfoot td:first-child { z-index: 25; left: 0; position: sticky; }
        tfoot td:nth-child(2) { z-index: 25; left: 120px; position: sticky; }

        .summary-badge {
            background: var(--accent-color);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        /* Handle small screens where sticky columns might take too much space */
        @media (max-width: 480px) {
            th:first-child, td:first-child { min-width: 100px; font-size: 0.75rem; }
            th:nth-child(2), td:nth-child(2) { left: 100px; min-width: 80px; font-size: 0.75rem; }
            thead th:nth-child(2), tfoot td:nth-child(2) { left: 100px; }
            header h1 { font-size: 1.2rem; }
        }

        .empty-state { padding: 40px; text-align: center; color: var(--secondary-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0;">Family Fund</h1>
            <span id="activeRange" class="summary-badge">...</span>
        </div>
        <button onclick="toggleTheme()" class="btn-secondary" id="themeBtn" style="font-size: 0.8rem;">🌙 Dark</button>
    </header>

    <div class="controls">
        <div class="control-group">
            <label>Years</label>
            <div id="yearSelect" class="multi-select"></div>
        </div>
        <div class="control-group">
            <label>Months</label>
            <div id="monthSelect" class="multi-select"></div>
        </div>
        <div class="control-group">
            <label>Search Members</label>
            <input type="text" id="userSearch" placeholder="Filter..." oninput="filterUserList()">
            <div id="userSelect" class="multi-select" style="margin-top:5px; height: 60px;"></div>
        </div>
        <div class="control-group">
            <label>Date Range</label>
            <div style="display:flex; gap:5px;">
                <input type="date" id="startDate" style="width:45%">
                <input type="date" id="endDate" style="width:45%">
            </div>
        </div>
        <div class="control-group">
            <div class="btn-group">
                <button onclick="resetFilters()" class="btn-secondary">Reset</button>
                <button onclick="exportCSV()" class="btn-success">Export</button>
            </div>
        </div>
    </div>

    <div class="table-container" id="scrollContainer">
        <table id="mainTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
            <tfoot id="tableFoot"></tfoot>
        </table>
        <div id="emptyMsg" class="empty-state" style="display:none;">No data.</div>
    </div>
</div>

    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    function parseDate(str) {
        if (!str) return null;
        const parts = str.split('-');
        if (parts.length === 3 && isNaN(parts[1])) {
            return new Date(parseInt(parts[2]), monthNames.indexOf(parts[1]), parseInt(parts[0]));
        }
        return new Date(str);
    }

    function formatDate(date, format) {
        if (!date || isNaN(date.getTime())) return "";
        const m = date.getMonth(), y = date.getFullYear();
        if (format === 'MMM-YY') return `${monthNames[m]}-${String(y).slice(-2)}`;
        if (format === 'YYYY-MM') return `${y}-${String(m + 1).padStart(2, '0')}`;
        if (format === 'YYYY-MM-DD') return `${y}-${String(m + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        return date.toLocaleDateString();
    }

    let rawData = [], filteredData = [], currentSort = { col: 0, desc: false };

    function init() {
        rawData = embeddedData.map(r => {
            const d = parseDate(r.paymentdate);
            return {
                user: (r.membername || "Unknown").trim(),
                amount: parseFloat(r.paymentamount) || 0,
                date: d,
                dateStr: formatDate(d, 'YYYY-MM-DD'),
                monthKey: formatDate(d, 'MMM-YY'),
                monthSort: formatDate(d, 'YYYY-MM')
            };
        }).filter(r => r.date && !isNaN(r.date.getTime()));

        populateFilters();
        const now = new Date();
        document.getElementById('endDate').value = formatDate(new Date(now.getFullYear(), now.getMonth() + 1, 0), 'YYYY-MM-DD');
        applyFilters();
    }

    function populateFilters() {
        const years = [...new Set(rawData.map(r => r.date.getFullYear()))].sort();
        const users = [...new Set(rawData.map(r => r.user))].sort();
        document.getElementById('yearSelect').innerHTML = years.map(y => `<label><input type="checkbox" value="${y}" checked onchange="applyFilters()"> ${y}</label>`).join('');
        document.getElementById('monthSelect').innerHTML = monthNames.map((m, i) => `<label><input type="checkbox" value="${i}" checked onchange="applyFilters()"> ${m}</label>`).join('');
        document.getElementById('userSelect').innerHTML = users.map(u => `<label class="user-item"><input type="checkbox" value="${u}" checked onchange="applyFilters()"> ${u}</label>`).join('');
    }

    function filterUserList() {
        const q = document.getElementById('userSearch').value.toLowerCase();
        document.querySelectorAll('.user-item').forEach(el => el.style.display = el.innerText.toLowerCase().includes(q) ? 'flex' : 'none');
    }

    function applyFilters() {
        const selY = [...document.querySelectorAll('#yearSelect input:checked')].map(i => Number(i.value));
        const selM = [...document.querySelectorAll('#monthSelect input:checked')].map(i => Number(i.value));
        const selU = [...document.querySelectorAll('#userSelect input:checked')].map(i => i.value);
        const start = document.getElementById('startDate').value, end = document.getElementById('endDate').value;

        filteredData = rawData.filter(r => {
            const matchU = selU.includes(r.user);
            let matchD = (start || end) ? ((!start || r.dateStr >= start) && (!end || r.dateStr <= end)) : (selY.includes(r.date.getFullYear()) && selM.includes(r.date.getMonth()));
            return matchU && matchD;
        });

        if (filteredData.length > 0) {
            const d = filteredData.map(r => r.date).sort((a,b)=>a-b);
            document.getElementById('activeRange').innerText = `${formatDate(d[0], 'MMM-YY')} to ${formatDate(d[d.length-1], 'MMM-YY')}`;
        }
        processPivot();
    }

    function processPivot() {
        const container = document.getElementById('mainTable');
        if (filteredData.length === 0) {
            document.getElementById('emptyMsg').style.display = 'block';
            container.style.display = 'none';
            return;
        }
        document.getElementById('emptyMsg').style.display = 'none';
        container.style.display = 'table';

        const monthMap = {};
        filteredData.forEach(r => monthMap[r.monthSort] = r.monthKey);
        const sortedMonths = Object.keys(monthMap).sort();
        const displayMonths = sortedMonths.map(k => monthMap[k]);

        const users = [...new Set(filteredData.map(r => r.user))];
        const matrix = {};
        users.forEach(u => {
            matrix[u] = { total: 0, months: {} };
            displayMonths.forEach(m => matrix[u].months[m] = 0);
        });
        filteredData.forEach(r => {
            matrix[r.user].months[r.monthKey] += r.amount;
            matrix[r.user].total += r.amount;
        });

        let rows = users.map(u => ({ name: u, total: matrix[u].total, months: displayMonths.map(m => matrix[u].months[m]) }));
        
        const c = currentSort.col;
        rows.sort((a, b) => {
            let va = (c===0?a.name:(c===1?a.total:a.months[c-2])), vb = (c===0?b.name:(c===1?b.total:b.months[c-2]));
            return currentSort.desc ? (va < vb ? 1 : -1) : (va > vb ? 1 : -1);
        });

        const gTotals = displayMonths.map((m, i) => rows.reduce((s, r) => s + r.months[i], 0));
        const gSum = rows.reduce((s, r) => s + r.total, 0);

        document.getElementById('tableHead').innerHTML = ["Member Name", "Total Amount", ...displayMonths].map((h, i) => `<th onclick="setSort(${i})">${h}${currentSort.col===i?(currentSort.desc?' ▼':' ▲'):''}</th>`).join('');
        document.getElementById('tableBody').innerHTML = rows.map(r => `<tr><td>${r.name}</td><td>₹${r.total.toLocaleString('en-IN')}</td>${r.months.map(m => `<td>₹${m.toLocaleString('en-IN')}</td>`).join('')}</tr>`).join('');
        document.getElementById('tableFoot').innerHTML = `<tr><td>TOTAL</td><td>₹${gSum.toLocaleString('en-IN')}</td>${gTotals.map(t => `<td>₹${t.toLocaleString('en-IN')}</td>`).join('')}</tr>`;
    }

    function setSort(i) {
        if (currentSort.col === i) currentSort.desc = !currentSort.desc;
        else { currentSort.col = i; currentSort.desc = (i !== 0); }
        processPivot();
    }

    function resetFilters() {
        document.getElementById('startDate').value = '';
        document.getElementById('userSearch').value = '';
        const now = new Date();
        document.getElementById('endDate').value = formatDate(new Date(now.getFullYear(), now.getMonth() + 1, 0), 'YYYY-MM-DD');
        [...document.querySelectorAll('.controls input[type=checkbox]')].forEach(i => i.checked = true);
        filterUserList();
        applyFilters();
    }

    function toggleTheme() {
        const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('themeBtn').innerText = t === 'light' ? '🌙 Dark' : '☀️ Light';
    }

    function exportCSV() {
        let csv = "Member Name,Total Amount," + [...document.querySelectorAll('#tableHead th')].slice(2).map(th => th.innerText.split(' ')[0]).join(',') + "\n";
        [...document.querySelectorAll('#tableBody tr')].forEach(tr => {
            csv += [...tr.querySelectorAll('td')].map(td => td.innerText.replace('₹', '').replace(/,/g, '')).join(',') + "\n";
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'payment_export.csv'; a.click();
    }

    init();
</script>
</body>
</html>
